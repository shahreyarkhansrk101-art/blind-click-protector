<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      padding: 15px;
      font-family: sans-serif;
      background: #f9f9f9;
      color: #333;
    }
    h2 { font-size: 16px; margin-top: 0; color: #0070f3; }
    button {
      width: 100%;
      padding: 10px;
      background: #0070f3;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background: #0051a2; }
    #result {
      margin-top: 15px;
      padding: 10px;
      background: #fff;
      border-radius: 4px;
      border: 1px solid #ddd;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h2>🛡️ Blind Click Protector</h2>
  <p style="font-size: 12px;">Scan this page's text for hidden risks.</p>
  <button id="scanBtn">Scan Current Page</button>
  <div id="result" style="display: none;"></div>
  <script src="popup.js"></script>
</body>
</html>
